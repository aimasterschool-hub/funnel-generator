<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファネル生成ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 36px;
    }
    .field { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .radio-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .radio-group input[type="radio"] { display: none; }
    .radio-group label {
      flex: 1;
      min-width: 120px;
      padding: 12px 16px;
      background: #12122a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #ccc;
      text-transform: none;
      letter-spacing: 0;
      transition: all 0.15s;
    }
    .radio-group input[type="radio"]:checked + label {
      background: #2a2060;
      border-color: #6c5ce7;
      color: #fff;
    }
    .radio-group label:hover {
      border-color: #444;
      color: #fff;
    }
    .drop-zone {
      border: 2px dashed #2a2a4a;
      border-radius: 10px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6c5ce7;
      background: rgba(108,92,231,0.06);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-text { font-size: 0.9rem; color: #888; }
    .drop-text span { color: #6c5ce7; }
    .file-name {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.2em;
    }
    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(220,50,50,0.12);
      border: 1px solid rgba(220,50,50,0.4);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #f88;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>ファネル生成ツール</h1>
  <p class="subtitle">台本（.docx）をアップロードしてLP・ファネルを自動生成します</p>
  <p style="text-align:right;margin-top:-16px;margin-bottom:24px;">
    <a href="/samples" style="font-size:0.78rem;color:#6c5ce7;text-decoration:none;">⚙ サンプル管理</a>
  </p>

  <div class="error" id="errorBox"></div>

  <form id="genForm">
    <div class="field">
      <label>ファネル種類</label>
      <div class="radio-group">
        <input type="radio" name="funnel_type" id="ft_optin" value="optin" checked>
        <label for="ft_optin">オプトインLP</label>
        <input type="radio" name="funnel_type" id="ft_ep1" value="video_funnel_ep1">
        <label for="ft_ep1">動画 1話</label>
        <input type="radio" name="funnel_type" id="ft_ep2" value="video_funnel_ep2">
        <label for="ft_ep2">動画 2話</label>
        <input type="radio" name="funnel_type" id="ft_ep3" value="video_funnel_ep3">
        <label for="ft_ep3">動画 3話</label>
        <input type="radio" name="funnel_type" id="ft_ep4" value="video_funnel_ep4">
        <label for="ft_ep4">動画 4話</label>
        <input type="radio" name="funnel_type" id="ft_ep5" value="video_funnel_ep5">
        <label for="ft_ep5">動画 5話</label>
        <input type="radio" name="funnel_type" id="ft_sales" value="sales_lp">
        <label for="ft_sales">販売LP</label>
      </div>
    </div>

    <div class="field">
      <label>長さ</label>
      <div class="radio-group">
        <input type="radio" name="length" id="len_long" value="long" checked>
        <label for="len_long">ロング</label>
        <input type="radio" name="length" id="len_short" value="short">
        <label for="len_short">ショート</label>
      </div>
    </div>

    <div class="field">
      <label>台本 / 概要ファイル（.docx / .txt / .md）</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" name="script_file" id="fileInput" accept=".docx,.txt,.md">
        <div class="drop-icon">📄</div>
        <div class="drop-text">ファイルをドロップ、または<span>クリックして選択</span></div>
        <div class="file-name" id="fileName"></div>
      </div>
    </div>

    <button type="submit" id="submitBtn">生成を開始する</button>
  </form>

  <!-- 不明項目入力パネル（初期非表示） -->
  <div id="missingPanel" style="display:none;margin-top:24px;">
    <div style="font-size:0.85rem;font-weight:700;color:#f0c040;margin-bottom:4px;">
      ⚠ 以下の項目が不明です。入力してください
    </div>
    <div style="font-size:0.78rem;color:#888;margin-bottom:16px;">
      LP生成の精度に影響します。分からない場合はスキップも可能です。
    </div>
    <form id="missingForm">
      <div id="missingFields"></div>
      <button type="submit" id="confirmBtn"
        style="width:100%;padding:14px;margin-top:8px;
               background:linear-gradient(135deg,#f0c040,#e0a000);
               color:#111;font-size:1rem;font-weight:700;
               border:none;border-radius:10px;cursor:pointer;">
        この内容で生成を開始する
      </button>
    </form>
  </div>
</div>

<style>
  .missing-field { margin-bottom:18px; }
  .missing-field label {
    display:block;font-size:0.78rem;font-weight:700;
    color:#aaa;text-transform:none;letter-spacing:0;margin-bottom:6px;
  }
  .missing-field input {
    width:100%;padding:10px 14px;
    background:#12122a;border:1px solid #2a2a4a;
    border-radius:8px;color:#fff;font-size:0.9rem;
  }
  .missing-field input:focus { outline:none;border-color:#6c5ce7; }
  .missing-field .ex { font-size:0.72rem;color:#555;margin-top:4px; }
</style>

<script>
  const fileInput    = document.getElementById('fileInput');
  const fileName     = document.getElementById('fileName');
  const dropZone     = document.getElementById('dropZone');
  const submitBtn    = document.getElementById('submitBtn');
  const errorBox     = document.getElementById('errorBox');
  const missingPanel = document.getElementById('missingPanel');
  const missingFields= document.getElementById('missingFields');
  const confirmBtn   = document.getElementById('confirmBtn');
  let currentJobId   = null;

  fileInput.addEventListener('change', () => {
    fileName.textContent = fileInput.files[0]?.name || '';
  });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) {
      fileInput.files = e.dataTransfer.files;
      fileName.textContent = e.dataTransfer.files[0].name;
    }
  });

  document.getElementById('genForm').addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.style.display = 'none';
    missingPanel.style.display = 'none';

    if (!fileInput.files[0]) {
      errorBox.textContent = '台本ファイルを選択してください';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '設定を確認中...';

    const fd = new FormData(e.target);
    try {
      const res = await fetch('/api/generate', { method: 'POST', body: fd });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const { job_id, missing_fields } = await res.json();
      currentJobId = job_id;

      if (missing_fields && missing_fields.length > 0) {
        showMissingForm(missing_fields);
      } else {
        window.location.href = `/result/${job_id}`;
      }
    } catch (err) {
      errorBox.textContent = `エラー: ${err.message}`;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = '生成を開始する';
    }
  });

  function showMissingForm(fields) {
    missingFields.innerHTML = '';
    fields.forEach(f => {
      missingFields.innerHTML += `
        <div class="missing-field">
          <label>${f.label}</label>
          <input type="text" name="${f.id}" placeholder="${f.example}">
          <div class="ex">${f.example}</div>
        </div>`;
    });
    missingPanel.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = '生成を開始する';
    missingPanel.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('missingForm').addEventListener('submit', async e => {
    e.preventDefault();
    confirmBtn.disabled = true;
    confirmBtn.textContent = '生成を開始中...';

    const fd = new FormData(e.target);
    try {
      const res = await fetch(`/api/confirm/${currentJobId}`, { method: 'POST', body: fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      window.location.href = `/result/${currentJobId}`;
    } catch (err) {
      errorBox.textContent = `エラー: ${err.message}`;
      errorBox.style.display = 'block';
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'この内容で生成を開始する';
    }
  });
</script>
</body>
</html>
